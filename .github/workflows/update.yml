name: 데이터 갱신

on:
  schedule:
    - cron: '30 2 * * *' # 매일 11:30 KST (ASOS 전일 자료가 11시 이후에 나옴)
  workflow_dispatch:

permissions: {}

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # 쓰기 토큰은 .git/config에 남기지 않고 push 단계에서만 쓴다.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: 테스트
        working-directory: pipeline
        run: npm test

      # 검사를 통과한 파일만 저장된다. 실패한 대상이 있어도 성공한 것은 커밋하고, 마지막에 실패로 표시한다.
      # 작업 전체가 시간 초과로 취소되면 커밋 단계도 건너뛰므로, 이 단계만 끊고 그때까지 저장한 파일은 커밋한다.
      - name: 데이터 생성
        id: run
        continue-on-error: true
        timeout-minutes: 10
        working-directory: pipeline
        env:
          KMA_AUTH_KEY: ${{ secrets.KMA_AUTH_KEY }}
          ASOS_DAILY_KEY: ${{ secrets.ASOS_DAILY_KEY }}
          KOPIS_KEY: ${{ secrets.KOPIS_KEY }}
        run: node run.ts

      - name: 변경된 데이터 커밋
        env:
          TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/data/events.json web/public/data/closures.json web/public/data/forecast.json
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore(data): 데이터 자동 갱신"
            REMOTE="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git pull --rebase "$REMOTE" "$GITHUB_REF_NAME" # 실행 중 다른 push가 있으면 그 위에 올린다
            git push "$REMOTE" "HEAD:$GITHUB_REF_NAME"
          fi

      - name: 실패 표시
        if: steps.run.outcome == 'failure'
        run: |
          echo "일부 대상 생성 또는 검사 실패. 위 '데이터 생성' 로그 확인"
          exit 1
